name: A1 regression tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Fabio interface regression controls
        run: python -m unittest discover -s tests -p 'test_fabio_interface_regression.py' -v
